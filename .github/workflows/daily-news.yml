name: Daily news signal

# 매일 07:00 KST(=22:00 UTC) 자동: 뉴스 수집 → 감성 지수 → 당일(offset=0) 신호 → deploy 커밋.
# 시장은 미국 기준 — 07:00 KST면 전날 미국장 마감(한국 새벽) 직후라 '간밤 신호'가 신선하게 확정됨.
# ※ cron 은 이 파일이 기본 브랜치(main)에 있어야 작동. 작업 대상은 deploy 브랜치.
on:
  workflow_dispatch:              # 수동 실행 버튼 (Actions 탭)
  schedule:
    - cron: '0 22 * * *'          # 22:00 UTC = 07:00 KST (미국 마감 후, 한국 아침)

permissions:
  contents: write                 # 갱신 데이터 커밋·푸시용

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    env:
      SENTIMENT_ENGINE: finbert
      FINBERT_MODEL_DIR: models/finbert-finetuned
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      # 국채금리(2Y/10Y) 조회용. 없어도 공개 CSV 로 폴백하지만, 키가 있으면
      # 레이트리밋에 덜 걸려 결측이 줄어든다(결측이 기존 값을 지우진 않음 — upsert COALESCE).
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy/streamlit-dashboard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache FinBERT model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/finbert-finetuned
          key: finbert-model-v1

      - name: Download & unpack FinBERT model (캐시 미스 시에만)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          curl -L -o model.zip "${{ secrets.MODEL_URL }}"
          mkdir -p _m
          unzip -q -o model.zip -d _m || echo "unzip 경고 무시(exit $?) — config.json 존재로 검증"
          cfg="$(find _m -name config.json | head -1)"
          test -n "$cfg" || { echo "config.json 없음 — 모델 zip 확인"; exit 1; }
          rm -rf models/finbert-finetuned && mkdir -p models && mv "$(dirname "$cfg")" models/finbert-finetuned
          rm -rf _m model.zip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # langgraph 는 에이전트(agents/graph.py)의 필수 의존성 — 빠지면 ③단계가
          # ImportError 로 죽고, set -e 때문에 그 뒤 대시보드 갱신까지 통째로 건너뛴다.
          pip install transformers requests beautifulsoup4 pandas numpy yfinance langgraph

      - name: Run daily news pipeline (수집 → 지수 → 당일 신호)
        continue-on-error: true       # 일시적 API/네트워크 실패로 잡 전체가 죽지 않게
        run: sh scripts/run_news_daily.sh

      - name: Commit refreshed daily outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 경로별 개별 add — git add 는 한 경로라도 없으면 통째 실패(아무것도 스테이지 안 됨)하므로
          # 파일마다 따로 add 해 존재하는 것만 확실히 스테이지한다(수집분 유실 방지).
          # data/news/rejected_news.csv — 필터가 버린 기사. data/news/ 가 gitignore 라
          # 여기 목록에 없으면 러너가 사라질 때 함께 증발한다(2026-08: 하루 164건이 그렇게
          # 유실됐다). 필터 감사(docs/filter_audit.md)의 유일한 표본이므로 반드시 보존한다.
          for p in outputs/news_index_live.csv outputs/daily_headline.csv outputs/daily_signals.csv data/news/fed_news.csv data/news/rejected_news.csv data/statements data/minutes data/pressers \
                   outputs/axis_status.csv outputs/minutes_tones.csv outputs/presser_tones.csv \
                   outputs/vintage_meetings.csv \
                   dashboard-web/public/data; do
            git add -f "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "변경 없음 — 새 뉴스/신호 없음. 커밋 생략."
          else
            # [skip ci] 를 붙이지 않는다 — 이 커밋이 Pages 배포(pages.yml)를 깨워야
            # 매일 갱신된 데이터가 실제 사이트에 반영된다. 이 워크플로 자체는
            # schedule/workflow_dispatch 로만 도므로 push 로 재실행되지 않는다(루프 없음).
            git commit -m "chore: daily news signal refresh"
            git push origin HEAD:deploy/streamlit-dashboard
          fi
