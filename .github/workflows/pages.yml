name: Publish site

# Econpilot 정적 사이트를 대표 페이지(aicp-econpilot.github.io)로 배포.
#
# 왜 다른 레포로 푸시하나: 대표 주소(https://aicp-econpilot.github.io/)는
# **계정/조직 이름이 aicp-econpilot** 이고 그 안에 이름이 정확히
# `aicp-econpilot.github.io` 인 레포가 있을 때만 나온다.
# 소스는 이 레포(2026-AICP/fomc-sentiment-agents)에 두고, 빌드 결과(dist/)만 그쪽으로 밀어 넣는다.
#
# 언제 도나:
#   · deploy 브랜치에 push  → 매일 07:00 자동수집이 데이터를 커밋할 때마다 사이트 갱신
#   · 수동 실행 버튼
#
# 필요한 설정(1회): 이 레포 Settings → Secrets → Actions 에
#   PAGES_TOKEN = 대상 레포에 쓰기 권한이 있는 PAT (contents: write)

on:
  push:
    branches: [deploy/streamlit-dashboard]
    paths:
      - "dashboard-web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: aicp-econpilot/aicp-econpilot.github.io
    steps:
      - name: Checkout (deploy branch = 데이터가 최신인 쪽)
        uses: actions/checkout@v4
        with:
          ref: deploy/streamlit-dashboard

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        working-directory: dashboard-web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Verify build output
        working-directory: dashboard-web
        run: |
          test -f dist/index.html || { echo "dist/index.html 없음 — 빌드 실패"; exit 1; }
          n=$(ls dist/data/*.json 2>/dev/null | wc -l)
          echo "데이터 JSON ${n}개"
          [ "$n" -gt 0 ] || { echo "dist/data 에 JSON 없음 — export_dashboard 산출 확인"; exit 1; }

      - name: Publish to organization Pages repo
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PAGES_TOKEN 시크릿이 없습니다. 레포 Settings → Secrets → Actions 에 추가하세요."
            exit 1
          fi
          cd dashboard-web/dist
          # Pages 가 _로 시작하는 경로를 Jekyll 로 처리하지 않게(정적 파일 그대로 서빙)
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: ${GITHUB_SHA::7} 빌드 배포"
          # 토큰은 URL 에만 쓰고 출력하지 않는다 (-q, 로그 노출 방지)
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git" HEAD:main
          echo "배포 완료 → https://aicp-econpilot.github.io/"
